# Конфигурация приложения
config:
  ECHO_SERVER_RESPONSE: "Hello from Helm .values!"

# ... всё остальное без изменений

# Три реплики приложения
replicaCount: 3

# Включаем Service Account
serviceAccount:
  create: true

# Атрибуты подов (пригодятся позже)
podLabels: {}

# Настройка параметров сервиса
service:
  type: NodePort
  port: 8080
  nodePort: 30080

# Выключаем Ingress
ingress:
  enabled: false

# Healthchecks оставляем без изменений
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# Выключаем автоматическое масштабирование
autoscaling:
  enabled: false

image:
  repository: echo-server
  tag: "1.2" # Обновляем версию
# ...

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "echo-server"
  # Указываем, какой секрет нужно прочитать
  vault.hashicorp.com/agent-inject-secret-echo_server_response_sign_key: "secret/echo-server"
  # Указываем содержимое файла, в который сохранится секрет
  vault.hashicorp.com/agent-inject-template-echo_server_response_sign_key: |
    {{- with secret "secret/echo-server" -}}
    {{ .Data.data.echo_server_response_sign_key }}
    {{- end }}